[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wildlife-robustness"
version = "0.2.0"
description = "Camera-failure-aware augmentation for robust wildlife object detection"
requires-python = ">=3.10,<3.12"
dependencies = [
  "numpy>=1.24,<2.0",
  "opencv-python>=4.8,<5",
  "Pillow>=10",
  "PyYAML>=6",
]

[project.optional-dependencies]
train = ["ultralytics==8.1.0", "torch>=2.1"]
dev = ["pytest>=7.4", "ruff>=0.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
